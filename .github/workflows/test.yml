name: test
run-name: '[Test] ${{ github.event.head_commit.message || github.event.pull_request.title || github.ref_name }}'

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "master"

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library targets net8.0 only; running the same net8.0 test binaries under both
        # the 8.0.x and 9.0.x runtimes catches framework-specific regressions (e.g. runtime
        # behavior differences the library depends on) that a single-SDK job would miss.
        dotnet-version: ["8.0.x", "9.0.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test --configuration Release --no-build -- --report-trx --results-directory ${{ github.workspace }}/TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results-${{ matrix.dotnet-version }}-${{ github.run_id }}
          path: TestResults/*.trx
          retention-days: 7

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Unit Test Results (${{ matrix.dotnet-version }})
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # Verifies the IsAotCompatible=true claim in src/Directory.Build.props actually holds —
  # an unverified AOT claim is worse than no claim (see future-plans.md). Publishes the
  # samples project (the most representative consumer surface: DI, typed pipelines, every
  # built-in strategy) with Native AOT and fails on any trim/AOT analyzer warning.
  aot-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish samples with Native AOT
        run: >
          dotnet publish samples/Resilion.Samples/Resilion.Samples.csproj
          -c Release -r linux-x64 -p:PublishAot=true --self-contained
          /warnaserror:IL2026,IL2070,IL2072,IL3050,IL3053

      - name: Run the AOT-published binary
        run: ./samples/Resilion.Samples/bin/Release/net8.0/linux-x64/publish/Resilion.Samples
