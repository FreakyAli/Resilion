name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Guarantees global.json's 8.0.404 floor is present. This is NOT a pin: global.json requests
  # rollForward: latestMajor, so the SDK actually used is the newest installed on the runner.
  # The previous value (9.0.x) implied a pin that never took effect.
  DOTNET_VERSION: '8.0.x'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:ContinuousIntegrationBuild=true
